name: Build and Release Binaries

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tui_bin: rust_media_downloader
            popup_bin: media_popup
            tui_asset: rust_media_downloader-linux-x86_64
            popup_asset: media_popup-linux-x86_64
          - os: windows-latest
            tui_bin: rust_media_downloader.exe
            popup_bin: media_popup.exe
            tui_asset: rust_media_downloader-windows-x86_64.exe
            popup_asset: media_popup-windows-x86_64.exe
          - os: macos-latest
            tui_bin: rust_media_downloader
            popup_bin: media_popup
            tui_asset: rust_media_downloader-macos-arm64
            popup_asset: media_popup-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux X11, OpenGL & Clipboard Headers
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxfixes-dev libxkbcommon-dev libgl1-mesa-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Optimized Release Binaries (TUI + GUI Popup)
        run: cargo build --release --bins

      - name: Rename Binaries for Release
        shell: bash
        run: |
          cp target/release/${{ matrix.tui_bin }} ${{ matrix.tui_asset }}
          cp target/release/${{ matrix.popup_bin }} ${{ matrix.popup_asset }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.tui_asset }}
            ${{ matrix.popup_asset }}
          generate_release_notes: true
[package]
name = "rust_media_downloader"
version = "1.1.0"
edition = "2021"
default-run = "rust_media_downloader"
description = "High-concurrency TUI Media Downloader & Super+M Quick-Popup GUI"
license = "MIT"

[[bin]]
name = "rust_media_downloader"
path = "src/main.rs"

[[bin]]
name = "media_popup"
path = "src/bin/media_popup.rs"

[dependencies]
anyhow = "1.0"
arboard = "3.4"
crossterm = { version = "0.28", features = ["bracketed-paste"] }
dirs = "5.0"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11"] }
ratatui = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
[package]
name = "rust_media_downloader"
version = "1.0.0"
edition = "2021"
description = "High-concurrency TUI Media Downloader & Multimodal Data Ingestion Engine"
license = "MIT"

[dependencies]
anyhow = "1.0"
arboard = "3.4"
crossterm = { version = "0.28", features = ["bracketed-paste"] }
dirs = "5.0"
ratatui = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true